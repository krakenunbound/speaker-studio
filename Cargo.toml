[package]
name = "speaker-studio"
version = "0.1.0"
edition = "2021"
description = "Local speaker diarization studio"

[dependencies]
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = "0.15"
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
wasapi = "0.24"
